:root{--void:#0d0a07;--ink:#2b1d10;--par:#eadcb6;--par2:#f3e8c8;--cin:#b3281a;--gold:#c9a84c;--mut:#6d5a3d;--line:#8a6a1f;
--wood:#4f7a2e;--fire:#c0341d;--earth:#a67c1f;--metal:#6b7480;--water:#2c5a8c;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--serif:"IM Fell English","Iowan Old Style",Palatino,Georgia,serif;--disp:Papyrus,Herculanum,"IM Fell English",serif;--han:"Songti SC","Songti TC","STSong","PingFang SC",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:#e8dcc0;font:18px/1.5 var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.sel{-webkit-user-select:text;user-select:text}
.han{font-family:var(--han)}
#scrim{position:fixed;left:0;right:0;top:0;height:var(--sat);background:var(--void);z-index:90}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#view{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 10px) calc(14px + var(--sar)) calc(112px + var(--sab)) calc(14px + var(--sal))}
.wrap{max-width:640px;margin:0 auto}
h1,h2,.disp{font-family:var(--disp);letter-spacing:.04em}
.hero{text-align:center;padding:18px 0 4px}
.hero h1{font-size:36px;line-height:1.05;margin:4px 0 0;color:var(--gold);font-weight:400}
@media (max-height:900px){.hero{padding-top:6px}.hero p{font-size:17px;margin:6px auto}.seal{font-size:19px}}
.hero p{font-size:19px;margin:10px auto;max-width:520px;color:#e8dcc0}
.seal{display:inline-block;background:var(--cin);color:#f6e7c8;font:700 22px/1 var(--han);padding:9px 7px;border-radius:3px;writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:0 0 0 2px #0d0a07,0 0 0 3px #8a6a1f;animation:seal 6s ease-in-out infinite}
@keyframes seal{0%,100%{box-shadow:0 0 0 2px #0d0a07,0 0 0 3px #8a6a1f,0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 0 2px #0d0a07,0 0 0 3px #c9a84c,0 0 22px rgba(201,168,76,.35)}}
section,.card{background:var(--par);color:var(--ink);border-radius:12px;margin:16px 0;padding:18px 16px 20px;border:3px double var(--line);box-shadow:0 8px 30px #0008}
.card{background:var(--par2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;box-shadow:none}
section h2,.step h2{margin:0 0 2px;font-size:24px;color:var(--cin);font-weight:400}
.sub{margin:0 0 12px;color:var(--mut);font-style:italic;font-size:17px}
.stepno{display:inline-block;background:var(--cin);color:#f6e7c8;font:700 18px/1 var(--disp);padding:7px 10px;border-radius:7px;margin-right:8px;vertical-align:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.mid{justify-content:center;align-items:center}
button,.btn{font:600 17px var(--serif);background:var(--ink);color:#f3e8c8;border:0;border-radius:10px;padding:11px 16px;min-height:46px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button.alt{background:#fff6;color:var(--ink);border:1.5px solid var(--ink)}

<script>
// Plum Blossom (梅花易數) number method: one engine, used by the sheet builder, the explainer and the tests.
// Every rule here is checked against Shao Yong's own text (see test_engine.js and README.md).
(function (root) {
  'use strict';

  // 先天八卦數: 乾1 兌2 離3 震4 巽5 坎6 艮7 坤8. Lines are listed bottom to top, 1 = solid (yang), 0 = broken (yin).
  // The house verse (卷一 八卦象例): 乾三連 坤六斷 震仰盂 艮覆碗 離中虛 坎中滿 兌上缺 巽下斷.
  const TRI = {
    1: { n: 1, han: '乾', py: 'Qian', en: 'Heaven',   el: 'metal', bits: [1, 1, 1] },
    2: { n: 2, han: '兌', py: 'Dui',  en: 'Lake',     el: 'metal', bits: [1, 1, 0] },
    3: { n: 3, han: '離', py: 'Li',   en: 'Fire',     el: 'fire',  bits: [1, 0, 1] },
    4: { n: 4, han: '震', py: 'Zhen', en: 'Thunder',  el: 'wood',  bits: [1, 0, 0] },
    5: { n: 5, han: '巽', py: 'Xun',  en: 'Wind',     el: 'wood',  bits: [0, 1, 1] },
    6: { n: 6, han: '坎', py: 'Kan',  en: 'Water',    el: 'water', bits: [0, 1, 0] },
    7: { n: 7, han: '艮', py: 'Gen',  en: 'Mountain', el: 'earth', bits: [0, 0, 1] },
    8: { n: 8, han: '坤', py: 'Kun',  en: 'Earth',    el: 'earth', bits: [0, 0, 0] }
  };

  // 五行 in the order of the generating cycle: each element feeds the next one (木生火 火生土 土生金 金生水 水生木).
  const WHEEL = ['wood', 'fire', 'earth', 'metal', 'water'];
  const EL = {
    wood:  { han: '木', en: 'Wood' },
    fire:  { han: '火', en: 'Fire' },
    earth: { han: '土', en: 'Earth' },
    metal: { han: '金', en: 'Metal' },
    water: { han: '水', en: 'Water' }
  };

  // Counting clockwise round the wheel from ME (體) to IT (用): 0 same, 1 I feed it, 2 I beat it, 3 it beats me, 4 it feeds me.
  const GRADE = [
    { step: 0, key: 'same',   han: '體用比和', en: 'SAME',        verdict: 'good',  line: 'smooth: everything runs (百事順遂)' },
    { step: 1, key: 'leak',   han: '體生用',   en: 'I FEED IT',   verdict: 'bad',   line: 'a leak: cost and effort, little comes back (耗失之患, 多謀少遂)' },
    { step: 2, key: 'win',    han: '體克用',   en: 'I BEAT IT',   verdict: 'good',  line: 'yes, but late and by effort (吉, 成之遲)' },
    { step: 3, key: 'hit',    han: '用克體',   en: 'IT BEATS ME', verdict: 'worst', line: 'no; even if it comes it harms (凶, 成亦有害)' },
    { step: 4, key: 'gift',   han: '用生體',   en: 'IT FEEDS ME', verdict: 'best',  line: 'gain arrives, it forms without scheming (進益之喜, 不謀而成)' }
  ];

  // The hour is added to the moving-line sum (卷一 爻以六除: 取爻當以時加之). 子1 丑2 寅3 卯4 辰5 巳6 午7 未8 申9 酉10 戌11 亥12.
  const BRANCH = [
    { n: 1,  han: '子', py: 'zi',   animal: 'Rat',     from: 23, to: 1  },
    { n: 2,  han: '丑', py: 'chou', animal: 'Ox',      from: 1,  to: 3  },
    { n: 3,  han: '寅', py: 'yin',  animal: 'Tiger',   from: 3,  to: 5  },
    { n: 4,  han: '卯', py: 'mao',  animal: 'Rabbit',  from: 5,  to: 7  },
    { n: 5,  han: '辰', py: 'chen', animal: 'Dragon',  from: 7,  to: 9  },
    { n: 6,  han: '巳', py: 'si',   animal: 'Snake',   from: 9,  to: 11 },
    { n: 7,  han: '午', py: 'wu',   animal: 'Horse',   from: 11, to: 13 },
    { n: 8,  han: '未', py: 'wei',  animal: 'Goat',    from: 13, to: 15 },
    { n: 9,  han: '申', py: 'shen', animal: 'Monkey',  from: 15, to: 17 },
    { n: 10, han: '酉', py: 'you',  animal: 'Rooster', from: 17, to: 19 },
    { n: 11, han: '戌', py: 'xu',   animal: 'Dog',     from: 19, to: 21 },
    { n: 12, han: '亥', py: 'hai',  animal: 'Pig',     from: 21, to: 23 }
  ];

  // King Wen numbers by [lower][upper], trigram order 1..8 (乾 兌 離 震 巽 坎 艮 坤).
  const KW = [
    null,
    [null, 1, 43, 14, 34, 9, 5, 26, 11],
    [null, 10, 58, 38, 54, 61, 60, 41, 19],
    [null, 13, 49, 30, 55, 37, 63, 22, 36],
    [null, 25, 17, 21, 51, 42, 3, 27, 24],
    [null, 44, 28, 50, 32, 57, 48, 18, 46],
    [null, 6, 47, 64, 40, 59, 29, 4, 7],
    [null, 33, 31, 56, 62, 53, 39, 52, 15],
    [null, 12, 45, 35, 16, 20, 8, 23, 2]
  ];
  const HEXNAME = [null,
    ['乾', 'Qian'], ['坤', 'Kun'], ['屯', 'Zhun'], ['蒙', 'Meng'], ['需', 'Xu'], ['訟', 'Song'], ['師', 'Shi'], ['比', 'Bi'],
    ['小畜', 'Xiaochu'], ['履', 'Lü'], ['泰', 'Tai'], ['否', 'Pi'], ['同人', 'Tongren'], ['大有', 'Dayou'], ['謙', 'Qian'], ['豫', 'Yu'],
    ['隨', 'Sui'], ['蠱', 'Gu'], ['臨', 'Lin'], ['觀', 'Guan'], ['噬嗑', 'Shihe'], ['賁', 'Bi'], ['剝', 'Bo'], ['復', 'Fu'],
    ['无妄', 'Wuwang'], ['大畜', 'Daxu'], ['頤', 'Yi'], ['大過', 'Daguo'], ['坎', 'Kan'], ['離', 'Li'], ['咸', 'Xian'], ['恆', 'Heng'],
    ['遯', 'Dun'], ['大壯', 'Dazhuang'], ['晉', 'Jin'], ['明夷', 'Mingyi'], ['家人', 'Jiaren'], ['睽', 'Kui'], ['蹇', 'Jian'], ['解', 'Xie'],
    ['損', 'Sun'], ['益', 'Yi'], ['夬', 'Guai'], ['姤', 'Gou'], ['萃', 'Cui'], ['升', 'Sheng'], ['困', 'Kun'], ['井', 'Jing'],
    ['革', 'Ge'], ['鼎', 'Ding'], ['震', 'Zhen'], ['艮', 'Gen'], ['漸', 'Jian'], ['歸妹', 'Guimei'], ['豐', 'Feng'], ['旅', 'Lü'],
    ['巽', 'Xun'], ['兌', 'Dui'], ['渙', 'Huan'], ['節', 'Jie'], ['中孚', 'Zhongfu'], ['小過', 'Xiaoguo'], ['既濟', 'Jiji'], ['未濟', 'Weiji']
  ];

  // Remainder with the Shao Yong convention: nothing left over counts as the full divisor (得八數整即坤; 除盡取六).
  function modN(n, m) {
    const r = n % m;
    return r === 0 ? m : r;
  }

  // Clock hour 0-23 to hour-branch number 1-12. 23:00 to 00:59 is 子 (1).
  function hourNumber(h) {
    return (Math.floor((h + 1) / 2) % 12) + 1;
  }

  function triFromBits(bits) {
    for (let n = 1; n <= 8; n++) {
      const b = TRI[n].bits;
      if (b[0] === bits[0] && b[1] === bits[1] && b[2] === bits[2]) return n;
    }
    throw new Error('bad bits ' + bits);
  }

  function hexNumber(upper, lower) { return KW[lower][upper]; }

  function hexInfo(upper, lower) {
    const num = hexNumber(upper, lower);
    return { num: num, han: HEXNAME[num][0], py: HEXNAME[num][1], upper: upper, lower: lower };
  }

  // Relation of IT (a trigram number) to ME (a trigram number), seen from ME.
  function relation(meTri, itTri) {
    const me = WHEEL.indexOf(TRI[meTri].el);
    const it = WHEEL.indexOf(TRI[itTri].el);
    const step = (it - me + 5) % 5;
    return Object.assign({ step: step }, GRADE[step]);
  }

  // Nuclear towers (互卦) of a six-line figure given as an array of 6 bits (line 1 first):
  // lower = lines 2,3,4; upper = lines 3,4,5.
  function nuclearOf(lines) {
    return {
      lower: triFromBits([lines[1], lines[2], lines[3]]),
      upper: triFromBits([lines[2], lines[3], lines[4]])
    };
  }

  // The whole cast. upperRaw and lowerRaw are the numbers that make the two towers; lineSum is the total that
  // makes the moving floor (it already includes the hour). Nothing here reads a clock.
  function build(upperRaw, lowerRaw, lineSum) {
    const upper = modN(upperRaw, 8);
    const lower = modN(lowerRaw, 8);
    const line = modN(lineSum, 6);
    const lines = TRI[lower].bits.concat(TRI[upper].bits);
    const movingIsUpper = line > 3;
    const bodyTri = movingIsUpper ? lower : upper;     // 體: the tower without the moving line
    const useTri = movingIsUpper ? upper : lower;      // 用: the tower with the moving line
    const changedLines = lines.slice();
    changedLines[line - 1] = lines[line - 1] ? 0 : 1;
    const changedLower = triFromBits(changedLines.slice(0, 3));
    const changedUpper = triFromBits(changedLines.slice(3, 6));
    const changedTri = movingIsUpper ? changedUpper : changedLower;

    // 乾坤無互, 互其變卦: for pure Heaven and pure Earth the nuclear figure is the figure itself, so take it from the changed one.
    const pure = (upper === lower) && (upper === 1 || upper === 8);
    const nuclear = nuclearOf(pure ? changedLines : lines);

    const start = relation(bodyTri, useTri);
    const middleLower = relation(bodyTri, nuclear.lower);
    const middleUpper = relation(bodyTri, nuclear.upper);
    const end = relation(bodyTri, changedTri);

    return {
      upperRaw: upperRaw, lowerRaw: lowerRaw, lineSum: lineSum,
      upper: upper, lower: lower, line: line,
      lines: lines, changedLines: changedLines,
      movingIsUpper: movingIsUpper,
      body: bodyTri, use: useTri, changed: changedTri,
      nuclearFromChanged: pure,
      nuclear: nuclear,
      primary: hexInfo(upper, lower),
      nuclearHex: hexInfo(nuclear.upper, nuclear.lower),
      changedHex: hexInfo(changedUpper, changedLower),
      start: start, middleLower: middleLower, middleUpper: middleUpper, end: end,
      tally: tally([start, middleLower, middleUpper, end])
    };
  }

  // Count the four looks against ME. Friends = feeds me or is the same as me; hitters = beats me; leaks = I feed it; wins = I beat it.
  function tally(rels) {
    const t = { gift: 0, same: 0, hit: 0, leak: 0, win: 0 };
    rels.forEach(function (r) { t[r.key] += 1; });
    t.friends = t.gift + t.same;
    t.hitters = t.hit;
    return t;
  }

  // Number method: two numbers and the hour. Upper from N1, lower from N2, moving line from N1 + N2 + hour number.
  function twoNumbers(n1, n2, hourNo) { return build(n1, n2, n1 + n2 + hourNo); }

  // One countable thing plus the hour (物數占): upper from the count, lower from the hour number; line from count + hour number.
  function countAndHour(n, hourNo) { return build(n, hourNo, n + hourNo); }

  // Date method (年月日時起例): upper from year-branch + lunar month + lunar day; lower and line also add the hour.
  function dateMethod(yearBranchNo, lunarMonth, lunarDay, hourNo) {
    const ymd = yearBranchNo + lunarMonth + lunarDay;
    return build(ymd, ymd + hourNo, ymd + hourNo);
  }

  const api = {
    TRI: TRI, WHEEL: WHEEL, EL: EL, GRADE: GRADE, BRANCH: BRANCH, KW: KW, HEXNAME: HEXNAME,
    modN: modN, hourNumber: hourNumber, triFromBits: triFromBits, hexInfo: hexInfo, relation: relation,
    nuclearOf: nuclearOf, build: build, tally: tally, twoNumbers: twoNumbers, countAndHour: countAndHour, dateMethod: dateMethod
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MEIHUA = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

   Method and judgement: Shao Yong (attr.), 梅花易數 卷一–卷三 only: 體用, 互, 變, 衰旺論, 占婚/疾病/官訟/生產/出行.

  const last=book()[0];
  view().innerHTML=`<div class="wrap"><div class="hero"><div class="seal">梅花易數</div><h1>PLUM BLOSSOM<br>THE ONE MOVE</h1>
  <p>Two numbers. Two towers. One floor breaks. Ask only: <i>does the broken tower feed me, fight me, or drain me?</i></p>
  <p class="small" style="color:#a99a78"><span class="han">不動不占，不因事不占</span><br>no stir, no cast. no cause, no cast.</p></div>
  <section><h2><span class="stepno">起</span>CAST</h2><p class="sub">Shao Yong's number method, from his own book, taught while you do it.</p>
  <div style="text-align:center;margin:6px 0 12px"><button class="go" onclick="startCast()">Cast a question</button></div>
  <div class="card"><b>Your level: ${LEVELS[S.level]}</b><br><small>${LEVEL_TEXT[S.level]}</small>
  <div class="chips">${[1,2,3].map(l=>`<button class="chip ${S.level===l?'sel':''}" onclick="setLevel(${l})">${l} · ${LEVELS[l]}</button>`).join('')}</div></div>
  <div class="row mid" style="margin-top:12px"><button class="alt" onclick="go('learn')">Learn it first</button>${last?`<button class="alt" onclick="openCast('${esc(last.id)}')">Last cast</button>`:''}</div></section>
  ${(IOS&&!STANDALONE)?`<p class="small" style="text-align:center"><a href="#" style="color:#c9a84c" onclick="installSheet();return false">put it on the Home Screen</a></p>`:''}</div>`;
}
function setLevel(l){ S.level=l; S.clean=0; saveS(); sfx.tap(); castHome(); }

/* ---------------- the wizard ---------------- */
const STEPS=['ask','numbers','hour','towers','floor','tag','looks','read'];
function startCast(){ Sound.init(); Sound.startDrone(); Wake.on(); sfx.tap();
  const now=new Date();
  W={step:0,q:'',topic:'general',n1:null,n2:null,method:'type',ans:{},cor:{},score:{ok:0,tot:0},now:now.getTime(),hourClock:E.hourNumber(now.getHours()),hourNo:null,call:null,looksShown:1,counter:{which:1,v:[0,0]},saved:false};
  VIEW='cast'; setDock(); renderStep(); }
const R = () => (W && W.n1!=null && W.n2!=null && W.hourNo!=null) ? E.twoNumbers(W.n1,W.n2,W.hourNo) : null;
function progress(){ return `<div class="prog">${STEPS.map((s,i)=>`<i class="${i<W.step?'d':i===W.step?'c':''}"></i>`).join('')}</div>`; }
function allDone(keys){ return keys.every(k=>W.ans[k]&&W.ans[k].done); }
/* a question the app asks the person. level 1: shown; 2: two tries + hint; 3: one try, no hint */
function ask(key,correct,opts,hintHTML){
  W.cor[key]=correct; let a=W.ans[key];
  if(S.level===1){ if(!a) a=W.ans[key]={done:true,auto:true}; }
  const chips=opts.map(o=>{ const done=a&&a.done, isC=o.v===correct; let cls='';
    if(S.level===1 && isC) cls='sel'; else if(done&&isC) cls='ok'; else if(a&&a.wrong===o.v&&!done) cls='no'; else if(a&&a.tried&&a.tried.includes(o.v)&&!done) cls='no';
    return `<button class="chip ${cls}" ${done?'disabled':''} onclick="pick('${key}',${JSON.stringify(o.v).replace(/"/g,'&quot;')})">${o.label}</button>`; }).join('');
  let note='';
  if(S.level===1) note=`<div class="worked fadein">${hintHTML||''}</div>`;
  else if(a&&a.done&&!a.ok) note=`<div class="worked fadein"><b>Worked out:</b> ${hintHTML||''}</div>`;
  else if(a&&a.done&&a.ok) note=`<div class="fadein small" style="color:#2d6a3a"><b>✓ ${a.tries?'Got it.':'Right first time.'}</b></div>`;
  else if(a&&a.tries&&S.level===2) note=`<div class="hint fadein">Not that one. ${hintHTML||''}</div>`;
  else if(a&&a.tries&&S.level===3) note='';
  return `<div class="chips">${chips}</div>${note}`; }
function pick(key,v){ Sound.init(); const a=W.ans[key]||(W.ans[key]={tries:0,tried:[]}); if(a.done) return; if(!a.tried) a.tried=[];
  if(v===W.cor[key]){ a.done=true; a.ok=a.tries===0; W.score.tot++; if(a.ok) W.score.ok++; Sound.pluck(440,.1); Haptic.tap(); }
  else { a.tries++; a.wrong=v; a.tried.push(v); Sound.thud(.3); Haptic.tap(); const lim=S.level===2?2:1; if(a.tries>=lim){ a.done=true; a.ok=false; W.score.tot++; } }
  keepScroll(renderStep); }
function keepScroll(fn){ const y=view().scrollTop; fn(); view().scrollTop=y; }
function nav(canNext,label){ return `<div class="nav"><button class="alt" onclick="stepBack()" ${W.step===0?'disabled':''}>◂ Back</button><button class="go" onclick="stepNext()" ${canNext?'':'disabled'}>${label||'Next ▸'}</button></div>`; }
function stepBack(){ if(W.step>0){ W.step--; sfx.tap(); renderStep(); view().scrollTop=0; } }
function stepNext(){ if(W.step<STEPS.length-1){ W.step++; sfx.tap(); renderStep(); view().scrollTop=0; } }

function renderStep(){
  const id=STEPS[W.step]; const f={ask:sAsk,numbers:sNumbers,hour:sHour,towers:sTowers,floor:sFloor,tag:sTag,looks:sLooks,read:sRead}[id]; f(); setDock(); }

/* 0 · the question and the breath */
function sAsk(){
  const T=TOPICS, chips=Object.keys(T).map(k=>`<button class="chip ${W.topic===k?'sel':''}" onclick="W.topic='${k}';keepScroll(renderStep)">${T[k].en}</button>`).join('');
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">0</span>THE QUESTION <span class="han">問</span></h2>
  <p class="sub">One question, alive now. Not a test, not a game, not asked twice.</p>
  <div class="card" style="text-align:center"><div class="breath" id="breath">breathe</div><button class="alt" id="bBtn" onclick="breathe()">Three breaths first</button><div class="small" style="margin-top:6px">In for four, out for six. You may skip it. The old rule is only that the mind is not busy.</div></div>
  <label class="small">Your question</label><textarea id="qq" placeholder="One question, seriously asked." oninput="W.q=this.value;$('nx').disabled=!W.q.trim()">${esc(W.q)}</textarea>
  <label class="small">It is about</label><div class="chips">${chips}</div>
  <div class="hint"><b>Rule of the founder:</b> cast once. A second throw for a better face is not a question.</div>
  ${nav(!!W.q.trim()).replace('onclick="stepNext()"','id="nx" onclick="stepNext()"')}</section></div>`; }
let breathing=false;
async function breathe(){ if(breathing) return; breathing=true; Sound.init(); Sound.startDrone(); const b=$('breath'), btn=$('bBtn'); if(btn) btn.disabled=true;
  for(let i=1;i<=3;i++){ if(!$('breath')) break; b.textContent='in'; b.className='breath in'; Sound.wind(4,.05,true); await sleep(4000); if(!$('breath')) break; b.textContent='out'; b.className='breath out'; Sound.wind(6,.04,false); await sleep(6000); }
  if($('breath')){ b.textContent='…'; b.className='breath'; Sound.bowl(NOTE.earth/2,.12,6); } if($('bBtn')) $('bBtn').disabled=false; breathing=false; }

/* 1 · two numbers */
function sNumbers(){
  const m=W.method;
  const tabs=[['type','I have two numbers'],['count','Count it'],['sky','The sky gives them']].map(([k,l])=>`<button class="chip ${m===k?'sel':''}" onclick="W.method='${k}';keepScroll(renderStep)">${l}</button>`).join('');
  let body='';
  if(m==='type') body=`<div class="row mid"><span>N1 <input id="a1" type="number" inputmode="numeric" min="1" max="99" value="${W.n1||''}" oninput="setNum()"></span><span>N2 <input id="a2" type="number" inputmode="numeric" min="1" max="99" value="${W.n2||''}" oninput="setNum()"></span></div><p class="small">Numbers that arrive while the question is alive: a count (people, steps, coins), sounds heard, a price, a plate, two numbers a friend says. Keep each under 100.</p>`;
  else if(m==='count'){ const k=W.counter; body=`<p class="sub">Tap once for each thing you count (people in the room, steps, coins). Then press <b>That is N${k.which}</b>.</p><div style="text-align:center"><button class="go" style="width:190px;height:190px;border-radius:50%;font-size:56px" onclick="cntTap()" id="cntBtn">${k.v[k.which-1]}</button><div class="row mid" style="margin-top:12px"><button class="alt" onclick="cntDone()" ${k.v[k.which-1]<1?'disabled':''}>That is N${k.which}</button><button class="alt" onclick="W.counter.v[W.counter.which-1]=0;keepScroll(renderStep)">Reset</button></div><div class="big" style="margin-top:8px">N1 = <b>${W.n1==null?'?':W.n1}</b> · N2 = <b>${W.n2==null?'?':W.n2}</b></div></div>`; }
  else body=`<p class="sub">If nothing arrives by itself, let the sky give two. They are only numbers.</p><div class="row mid"><button class="go" onclick="skyNums()">Give me two numbers</button></div><div class="big" style="text-align:center;margin-top:10px">N1 = <b>${W.n1==null?'?':W.n1}</b> · N2 = <b>${W.n2==null?'?':W.n2}</b></div>`;
  const ok=W.n1>=1&&W.n1<=99&&W.n2>=1&&W.n2<=99;
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">1</span>TWO NUMBERS <span class="han">數</span></h2><p class="sub">Your question: <i>${esc(W.q)}</i></p><div class="chips">${tabs}</div>${body}${nav(ok)}</section></div>`; }
function setNum(){ const a=parseInt($('a1').value,10),b=parseInt($('a2').value,10); W.n1=isFinite(a)?a:null; W.n2=isFinite(b)?b:null; const ok=W.n1>=1&&W.n1<=99&&W.n2>=1&&W.n2<=99; const nx=document.querySelector('.nav .go'); if(nx) nx.disabled=!ok; }
function cntTap(){ Sound.init(); const k=W.counter; if(k.v[k.which-1]<99) k.v[k.which-1]++; Sound.pluck(NOTE.wood*(1+(k.v[k.which-1]%5)*.0),.07); Haptic.tap(); $('cntBtn').textContent=k.v[k.which-1]; const d=document.querySelector('.row.mid .alt'); if(d) d.disabled=false; }
function cntDone(){ const k=W.counter; if(k.which===1){ W.n1=k.v[0]; k.which=2; } else { W.n2=k.v[1]; } Sound.bowl(NOTE.metal,.1,3); keepScroll(renderStep); }
function skyNums(){ Sound.init(); W.n1=1+Math.floor(Math.random()*98); W.n2=1+Math.floor(Math.random()*98); Sound.pluck(NOTE.water,.12); Sound.pluck(NOTE.fire,.1,.25); keepScroll(renderStep); }

/* 2 · the hour */
function sHour(){
  const hc=W.hourClock, now=new Date(W.now);
  const opts=E.BRANCH.map(b=>({v:b.n,label:`<span class="han">${b.han}</span> ${b.n}`}));
  const hint=`The clock says ${pad(now.getHours())}:${pad(now.getMinutes())}. Add 3 to the odd hour that starts your two-hour block and halve it (21:30 → 21 → 24 ÷ 2 = 12). That is <b class="han">${E.BRANCH[hc-1].han}</b> ${hc} (${E.BRANCH[hc-1].animal}, ${E.BRANCH[hc-1].from}:00–${E.BRANCH[hc-1].to}:00).`;
  const html=ask('hr',hc,opts,hint); if(W.ans.hr&&W.ans.hr.done) W.hourNo=hc;
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">2</span>THE HOUR <span class="han">時</span></h2><p class="sub">Twelve two-hour blocks, named for the twelve branches. 23:00–00:59 is 子, number 1.</p>
  <div class="card"><b>Which block is the clock in right now?</b> <span class="big">${pad(now.getHours())}:${pad(now.getMinutes())}</span>${html}</div>
  <p class="small">If you cast within minutes of an odd hour, the block is on the edge. Note both and see whether they differ.</p>${nav(allDone(['hr']))}</section></div>`; }

/* 3 · the two towers */
function trick8(n){ const t=Math.floor(n/10),o=n%10,s=t*2+o; return n<10?`${n} is under 8 or 9: ${n===8?'exactly 8 → 8 (Earth)':n===9?'9 − 8 = 1':`stays ${n}`}`:`double the tens, add the ones: ${t*2} + ${o} = ${s}${s>8?` → ${s} is still over 8: take 8 off (or repeat): ${E.modN(n,8)}`:` → ${E.modN(n,8)}`}`; }
function sTowers(){
  const r=R(), n1=W.n1,n2=W.n2, up=E.modN(n1,8), lo=E.modN(n2,8), opts=[1,2,3,4,5,6,7,8].map(n=>({v:n,label:`${n} <span class="han">${E.TRI[n].han}</span>`}));
  const h1=`${n1} ÷ 8: ${trick8(n1)}. Nothing left over counts as 8 (Earth). Left: <b>${up}</b> = ${tn(up)} ${E.TRI[up].en}.`, h2=`${n2} ÷ 8: ${trick8(n2)}. Left: <b>${lo}</b> = ${tn(lo)} ${E.TRI[lo].en}.`;
  const a=ask('up',up,opts,h1), b=ask('lo',lo,opts,h2);
  const fig=(W.ans.up&&W.ans.up.done&&W.ans.lo&&W.ans.lo.done)?`<div class="card fadein row mid">${towerSVG(up,70,56)} <span class="big">${tn(up)} above</span> ${towerSVG(lo,70,56)} <span class="big">${tn(lo)} below</span></div>`:'';
  if(fig&&!W._towersPlayed){ W._towersPlayed=1; Sound.init(); Sound.tower(up); Sound.tower(lo,.5); }
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">3</span>TWO TOWERS <span class="han">卦</span></h2><p class="sub">N1 ÷ 8, what is left? That is the <b>upper</b> tower. N2 ÷ 8: the <b>lower</b>. ${S.level===1?'':'Do it in your head, then tap.'}</p>
  <div class="card"><b>${n1} ÷ 8 leaves…</b> (upper)${a}</div><div class="card"><b>${n2} ÷ 8 leaves…</b> (lower)${b}</div>${fig}${nav(allDone(['up','lo']))}</section></div>`; }

/* 4 · the floor */
function sFloor(){
  const r=R(), sum=W.n1+W.n2+W.hourNo, fl=r.line, opts=[1,2,3,4,5,6].map(n=>({v:n,label:String(n)}));
  const t=Math.floor(sum/10),o=sum%10; const hint=`${W.n1} + ${W.n2} + ${W.hourNo} = <b>${sum}</b>. ÷ 6: four times the tens, add the ones: ${4*t} + ${o} = ${4*t+o}${4*t+o>6?` → still over 6, take 6s off`:''} → floor <b>${fl}</b>. Nothing left over counts as 6.`;
  const a=ask('fl',fl,opts,hint); const done=W.ans.fl&&W.ans.fl.done;
  const fig=done?`<div class="card fadein row mid">${hexSVG(r.lines,{mv:fl})}<div class="small" style="max-width:170px">Floors are counted from the <b>bottom</b>. Floor ${fl} is the one that breaks.</div></div>`:'';
  if(done&&!W._floorPlayed){ W._floorPlayed=1; Sound.init(); Sound.thud(.4); Sound.pluck(NOTE.fire,.1,.1); }
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">4</span>THE FLOOR <span class="han">爻</span></h2><p class="sub">Add N1 + N2 + the hour number: <b>${W.n1} + ${W.n2} + ${W.hourNo} = ${sum}</b>. Divide by 6; what is left is the floor that breaks.</p>
  <div class="card"><b>${sum} ÷ 6 leaves…</b> (the breaking floor)${a}</div>${fig}${nav(done)}</section></div>`; }

/* 5 · tag them */
function sTag(){
  const r=R(), fl=r.line, opts=[{v:'upper',label:'The upper tower'},{v:'lower',label:'The lower tower'}], correct=r.movingIsUpper?'upper':'lower';
  const hint=`Floor ${fl} is ${fl>3?'in the upper tower (floors 4, 5, 6)':'in the lower tower (floors 1, 2, 3)'}. The tower holding the breaking floor is <b>IT</b> (用, the matter). The other is <b>ME</b> (體, you).`;
  const a=ask('it',correct,opts,hint); const done=W.ans.it&&W.ans.it.done; const I=r.movingIsUpper;
  const cols=r.lines.map((_,i)=>i<3?C[E.TRI[r.lower].el]:C[E.TRI[r.upper].el]);
  const fig=done?`<div class="card fadein row mid">${hexSVG(r.lines,{mv:fl,col:cols,tags:[{y:30,t:I?'IT 用':'ME 體',c:I?'#b3281a':'#2b1d10'},{y:134,t:I?'ME 體':'IT 用',c:I?'#2b1d10':'#b3281a'}]})}<div class="big">IT ${tn(r.use)}<br>ME ${tn(r.body)}<br><small>Hexagram ${r.primary.num} <span class="han">${r.primary.han}</span>. You never read the name. You read the two towers.</small></div></div>`:'';
  if(done&&!W._tagPlayed){ W._tagPlayed=1; Sound.init(); Sound.tower(r.body); Sound.tower(r.use,.5); }
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">5</span>TAG THEM <span class="han">體用</span></h2><p class="sub">Which tower holds floor ${fl}?</p>
  <div class="card">${a}</div>${fig}${nav(done)}</section></div>`; }

/* 6 · three looks: start, middle, end */
function sLooks(){ let g=0; while(sLooksDraw() && g++<5); }
function sLooksDraw(){
  const r=R(), me=E.TRI[r.body].el; const before=W.looksShown;
  const W4=[
    {k:'w0',t:'1 · START (the two towers)',it:r.use,rel:r.start,say:`ME ${tn(r.body)} against IT ${tn(r.use)}.`},
    {k:'w1',t:'2 · MIDDLE, the lower middle tower (互)',it:r.nuclear.lower,rel:r.middleLower,say:`Floors 2-3-4 make ${tn(r.nuclear.lower)} against ME ${tn(r.body)}.`},
    {k:'w2',t:'2 · MIDDLE, the upper middle tower (互)',it:r.nuclear.upper,rel:r.middleUpper,say:`Floors 3-4-5 make ${tn(r.nuclear.upper)} against ME ${tn(r.body)}.`},
    {k:'w3',t:'3 · END (the breaking floor flips, 變)',it:r.changed,rel:r.end,say:`${tn(r.use)} becomes ${tn(r.changed)} against ME ${tn(r.body)}.`}];
  const order=['gift','same','win','leak','hit'], lab={gift:'IT feeds ME',same:'Same',win:'I beat IT',leak:'I feed IT',hit:'IT beats ME'};
  const opts=order.map(k=>({v:k,label:lab[k]}));
  let html='', allok=true;
  W4.forEach((x,i)=>{ if(i>W.looksShown-1) return; const itEl=E.TRI[x.it].el, st=x.rel.step;
    const hint=`Count clockwise on the wheel from ME ${eshape(me,14)} ${ELH[me]} to IT ${eshape(itEl,14)} ${ELH[itEl]}: <b>${st}</b> step${st===1?'':'s'}. ${E.GRADE[st].line}`;
    let pre='';
    if(i===1) pre=`<div class="card row mid fadein">${hexSVG(r.lines,{dim:[0,5],mv:r.line})}<div class="small" style="max-width:190px">Cover floor 1 and floor 6 with two fingers. Four floors are left: floors 2-3-4 make one tower, floors 3-4-5 the other.${r.nuclearFromChanged?' <b>Pure Heaven or Earth has no middle: take it from the changed figure.</b>':''}</div></div>`;
    if(i===3) pre=`<div class="card row mid fadein">${hexSVG(r.changedLines,{flipped:r.line})}<div class="small" style="max-width:190px">Flip floor ${r.line} (solid to broken, or the reverse). Only the breaking tower changes. Changed figure: ${r.changedHex.num} <span class="han">${r.changedHex.han}</span>.</div></div>`;
    const a=ask(x.k,x.rel.key,opts,hint), done=W.ans[x.k]&&W.ans[x.k].done;
    const wheel=done||S.level===1?`<div class="row mid fadein">${wheelSVG(me,itEl,false)}</div>`:'';
    html+=`${pre}<div class="card"><b>${x.t}</b><br>${x.say}${a}${wheel}${done?`<div class="fadein">${rel(x.rel)}<br><small>${x.rel.line}</small></div>`:''}</div>`;
    if(done&&!W['_p'+x.k]){ W['_p'+x.k]=1; Sound.init(); Sound.weigh(me,itEl,x.rel.key); }
    if(!done) allok=false; });
  const doneN=W4.filter(x=>W.ans[x.k]&&W.ans[x.k].done).length;
  if(doneN>=W.looksShown && W.looksShown<4){ W.looksShown=doneN+1; if(W.looksShown>before) return true; }
  const finished=doneN===4;
  view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">6</span>THREE LOOKS <span class="han">三象</span></h2><p class="sub">The same weighing, three times: start, middle, end. This is the whole reading. Five answers only: IT feeds ME · same · I beat IT · I feed IT · IT beats ME.</p>${html}${nav(finished,'Read it ▸')}</section></div>`;
  if(doneN>=W.looksShown-1 && doneN<4 && W.ans['w'+(W.looksShown-2)] && W.ans['w'+(W.looksShown-2)].done && !W['_sc'+W.looksShown]){ W['_sc'+W.looksShown]=1; setTimeout(()=>view().scrollBy({top:260,behavior:'smooth'}),350); } }

/* 7 · the reading */
function verdictFor(r,mo){
  const t=r.tally, str=strengthOf(r.body,mo), endK=r.end.key, startK=r.start.key;
  const good=k=>k==='gift'||k==='same'||k==='win';
  let word=VERDICT_WORD[endK], notes=[];
  notes.push(`The matter as it stands (start): ${r.start.en}, ${r.start.line}.`);
  notes.push(`Where it lands (end, 變 = the end of the matter): ${r.end.en}, ${r.end.line}.`);
  if(startK!==endK) notes.push(good(startK)&&!good(endK)?'It begins well and then turns.':!good(startK)&&good(endK)?'It begins hard and then turns good.':'The start and the end are different grades: read it as a story, in order.');
  if(t.hitters>=2&&t.friends===0) notes.push('Many hitters and no friends among the four looks: a clear no.');
  else if(t.friends>=3&&t.hitters===0) notes.push('Friends in nearly every look and no hitter: it holds.');
  if(str==='weak'&&t.hit>0) notes.push('ME is weak in this season and is beaten: the harm is heavy (體衰而逢克，則其凶甚矣).');
  if(str==='weak'&&t.gift>0) notes.push('ME is weak, but a tower that feeds it is present: the weakness is eased (體衰而有生體之卦，則衰稍解).');
  if(str==='strong'&&t.hit>0) notes.push('ME is beaten but strong in season: there is still some hope (體遇克而乘旺，猶為庶幾).');
  return {word:word[0],pos:word[1]==='pos',notes,strength:str}; }
function sRead(){
  const r=R(), now=new Date(W.now), mo=monthOf(now), v=verdictFor(r,mo), T=TOPICS[W.topic];
  if(S.level>1 && !W.call && !W.saved){
    view().innerHTML=`<div class="wrap">${progress()}<section><h2><span class="stepno">7</span>YOUR CALL <span class="han">斷</span></h2><p class="sub">Before I read it, you read it. Look at the four weighings above. Where does this land?</p>
    <div class="chips"><button class="chip" onclick="call('good')">It lands well</button><button class="chip" onclick="call('turn')">It turns</button><button class="chip" onclick="call('bad')">It lands hard</button></div>
    <div class="nav"><button class="alt" onclick="stepBack()">◂ Back</button></div></section></div>`; return; }
  const str=v.strength, SH=SEASON_HAN[mo.season], strTxt={strong:'strong, in season',weak:'weak, out of season',middling:'neither strong nor weak this season'}[str];

function mdOf(c){ const r=E.twoNumbers(c.n1,c.n2,c.hourNo), d=new Date(c.epoch), mo=monthOf(d), v=verdictFor(r,mo), T=TOPICS[c.topic]||TOPICS.general;

  let m=`# ${c.q}\n\n- **Cast:** ${d.toString()} (${c.method}), hour ${E.BRANCH[c.hourNo-1].han} ${c.hourNo}\n- **Method:** Shao Yong, 梅花易數 卷一–卷三, number method (two numbers and the hour)\n- **About:** ${T.en}\n- **Numbers:** N1 = ${c.n1}, N2 = ${c.n2}, hour = ${c.hourNo}\n\n## The figure\n\n- Upper ${tw(r.upper)}; lower ${tw(r.lower)}; hexagram ${r.primary.num} ${r.primary.han}\n- Floor ${r.line} breaks (${c.n1}+${c.n2}+${c.hourNo} = ${c.n1+c.n2+c.hourNo}, ÷ 6)\n- **IT 用** ${tw(r.use)} · **ME 體** ${tw(r.body)}\n- Middle (互): ${tw(r.nuclear.lower)} and ${tw(r.nuclear.upper)}${r.nuclearFromChanged?' (taken from the changed figure: pure Heaven/Earth)':''}\n- End (變): ${tw(r.changed)}; changed hexagram ${r.changedHex.num} ${r.changedHex.han}\n\n## The weighings against ME\n\n| Look | Against ME | Grade |\n|---|---|---|\n| Start | ${tw(r.use)} | ${r.start.en} (${r.start.han}) |\n| Middle, lower | ${tw(r.nuclear.lower)} | ${r.middleLower.en} (${r.middleLower.han}) |\n| Middle, upper | ${tw(r.nuclear.upper)} | ${r.middleUpper.en} (${r.middleUpper.han}) |\n| End | ${tw(r.changed)} | ${r.end.en} (${r.end.han}) |\n\nFriends ${r.tally.friends}, hitters ${r.tally.hitters}, I beat ${r.tally.win}, I feed ${r.tally.leak}.\n\n## Season (卷二 衰旺論)\n\n${SEASON_HAN[mo.season]}, month ${mo.b}. ME ${E.TRI[r.body].han} is ${v.strength}.\n\n## Reading\n\n**${v.word}**\n\n${v.notes.map(n=>'- '+n).join('\n')}\n`;
  if(T.lines&&T.lines[r.start.key]) m+=`\n- ${T.en} (${T.cite}): ${T.lines[r.start.key]}\n`;
  m+=`\n_Combining the four looks into one sentence is [CONSTRUCTED] from Shao Yong's grades and order; the grades themselves are his._\n\n## Practice\n\nLevel ${c.level}: ${c.score?c.score.ok:0} right first time of ${c.score?c.score.tot:0}.\n\n\`\`\`json\n${JSON.stringify(c)}\n\`\`\`\n`; return m; }
const slug = s => (s||'cast').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'cast';
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
async function giveFile(name,text,type){ if(TOUCH&&navigator.share&&window.File){ try{ const f=new File([text],name,{type}); if(!navigator.canShare||navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return 'shared'; } }catch(e){ if(e&&e.name==='AbortError') return 'cancelled'; } } download(name,text,type); return 'downloaded'; }
async function shareCast(id){ const c=book().find(x=>x.id===id); if(!c) return; const d=new Date(c.epoch), base=`meihua_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_${slug(c.q)}`;
  const r=await giveFile(base+'.md',mdOf(c),'text/markdown'); toast(r==='cancelled'?'Not saved: the share sheet was closed. The cast is still in the book.':r==='shared'?'In the share sheet, choose <b>Save to Files</b> and pick any folder you like, or AirDrop it.':'Saved to your downloads.',5200); }
async function copyCast(id){ const c=book().find(x=>x.id===id); if(!c) return; const md=mdOf(c); try{ await navigator.clipboard.writeText(md); toast('Copied the whole cast as text.'); }catch(e){ const t=document.createElement('textarea'); t.value=md; t.style.cssText='position:fixed;left:-999px;font-size:16px'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');toast('Copied the whole cast as text.');}catch(x){toast('Could not copy. Use Save instead.');} t.remove(); } }
async function shareBook(){ const d=new Date(); const r=await giveFile(`meihua_book_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`,JSON.stringify(book(),null,1),'application/json'); toast(r==='cancelled'?'Not shared.':r==='shared'?'The whole book was handed to the share sheet.':'The whole book was downloaded.',3800); }
async function restoreBook(inp){ let n=0; const have=new Set(book().map(c=>c.id)), b=book(); for(const f of inp.files){ try{ const j=JSON.parse(await f.text()); (Array.isArray(j)?j:[j]).forEach(c=>{ if(c&&c.id&&c.n1&&c.n2&&c.hourNo&&!have.has(c.id)){ b.push(c); have.add(c.id); n++; } }); }catch(e){} } b.sort((x,y)=>y.epoch-x.epoch); store.set('meihua.book',b.slice(0,400)); toast(n?`Restored ${n} cast${n>1?'s':''}.`:'Nothing new in that file.'); bookView(); }

  $('faceInfo').innerHTML=`<span class="han" style="font-size:30px">${t.han}</span> <b>${t.en}</b> · ${ELH[t.el]} ${eshape(t.el,18)}<br>Rhyme: ${V[selFace]}.<br>Opposite twin: ${tn(tw)} (flip every line, ${selFace}+${tw}=9).`; }
function barG(x,i,drawer,tap){ const y=60-i*28; return `<g style="cursor:pointer" onclick="${tap}">`+(x?`<rect x="0" y="${y}" width="120" height="16" fill="#2b1d10"/>`:`<rect x="0" y="${y}" width="48" height="16" fill="#2b1d10"/><rect x="72" y="${y}" width="48" height="16" fill="#2b1d10"/>`)+`<rect x="0" y="${y-4}" width="120" height="24" fill="transparent"/></g>`; }
function drawBuilder(){ let s='<svg width="120" height="80">'; bb.forEach((x,i)=>{ s+=barG(x,i,0,`bb[${i}]=1-bb[${i}];Sound.init();Sound.tick();drawBuilder()`); }); $('builder').innerHTML=s+'</svg>'; const n=E.triFromBits(bb),t=E.TRI[n]; $('buildOut').innerHTML=`${n} · ${tn(n)} ${t.en}`; }
function qDraw(){ let s='<svg width="120" height="80">'; qb.forEach((x,i)=>{ s+=barG(x,i,0,`qb[${i}]=1-qb[${i}];Sound.init();Sound.tick();qDraw()`); }); $('quizB').innerHTML=s+'</svg><button class="alt" onclick="qCheck()">check</button>'; }
function qCheck(){ const n=E.triFromBits(qb), ok=n===qn; $('quizOut').innerHTML=ok?`<b class="good">Right.</b> ${tn(n)} ${E.TRI[n].en}`:`That is ${n} ${tn(n)}. You were asked for ${qn} ${tn(qn)}.`; Sound.init(); ok?Sound.pluck(NOTE[E.TRI[n].el],.12):Sound.thud(.3); }
function wClick(el){ Sound.init(); if(!wMe||(wMe&&wIt)){ wMe=el; wIt=null; } else wIt=el; if(wMe&&wIt){ const st=(E.WHEEL.indexOf(wIt)-E.WHEEL.indexOf(wMe)+5)%5; Sound.weigh(wMe,wIt,E.GRADE[st].key); } else Sound.pluck(NOTE[el],.1); drawWheel(); }
function drawWheel(){ $('wheel').innerHTML=wheelSVG(wMe,wIt,true);
  $('ladder').innerHTML=[4,0,2,1,3].map(st=>{ const g=E.GRADE[st],ex=wMe?E.WHEEL[(E.WHEEL.indexOf(wMe)+st)%5]:null; return `<div style="${wMe&&wIt&&E.WHEEL[(E.WHEEL.indexOf(wMe)+st)%5]===wIt?'background:#b3281a33':''}"><span class="n">${st}</span><span style="flex:1"><b>${g.en}</b> <small class="han">${g.han}</small><br><small>${g.line}</small></span>${ex?eshape(ex,22)+' '+ELH[ex]:''}</div>`; }).join('');
  $('wheelOut').innerHTML=!wMe?'Pick <b>ME</b>.':!wIt?`ME is ${eshape(wMe,18)} ${ELH[wMe]}. Pick <b>IT</b>.`:(()=>{ const st=(E.WHEEL.indexOf(wIt)-E.WHEEL.indexOf(wMe)+5)%5; return `ME ${eshape(wMe,18)} → IT ${eshape(wIt,18)}: <b>${st}</b> steps clockwise.<br>${rel(E.GRADE[st])}<br><small>${E.GRADE[st].line}</small>`; })(); }
function lcast(){ return E.twoNumbers(+$('n1').value||1,+$('n2').value||1,+$('hr').value); }
function drawC4(){ const r=lcast(), names=['1 START','2 MIDDLE','3 END']; $('stepBtns').innerHTML=names.map((n,i)=>`<button class="chip ${look===i?'sel':''}" onclick="look=${i};Sound.init();Sound.tick();drawC4()">${n}</button>`).join('');
  const I=r.movingIsUpper, col=i=>((i>=3)===I)?C[E.TRI[r.use].el]:C[E.TRI[r.body].el]; let fig,txt;
  if(look===0){ fig=hexSVG(r.lines,{mv:r.line,col:r.lines.map((_,i)=>col(i)),tags:[{y:30,t:I?'IT':'ME',c:I?'#b3281a':'#2b1d10'},{y:134,t:I?'ME':'IT',c:I?'#2b1d10':'#b3281a'}]}); txt=`Upper ${tn(r.upper)} over lower ${tn(r.lower)} = ${r.primary.num} <span class="han">${r.primary.han}</span>.<br>Floor ${r.line} breaks, so <span class="tag it">IT</span> = ${tn(r.use)}, <span class="tag me">ME</span> = ${tn(r.body)}.<br>${rel(r.start)}<br><small>${r.start.line}</small>`; }
  else if(look===1){ fig=hexSVG(r.lines,{dim:[0,5],mv:r.line}); txt=`Cover floor 1 and floor 6 with two fingers. Four floors are left.<br>Floors 2-3-4 make ${tn(r.nuclear.lower)}. Floors 3-4-5 make ${tn(r.nuclear.upper)}.${r.nuclearFromChanged?'<br><small>Pure Heaven or Earth has no middle: take it from the changed figure.</small>':''}<br>Against ME ${tn(r.body)}: ${rel(r.middleLower)} and ${rel(r.middleUpper)}.`; }
  else { fig=hexSVG(r.changedLines,{flipped:r.line}); txt=`Flip floor ${r.line} (solid to broken or the reverse). Only the breaking tower changes: ${tn(r.use)} becomes ${tn(r.changed)}.<br>Changed figure: ${r.changedHex.num} <span class="han">${r.changedHex.han}</span>.<br>Against ME ${tn(r.body)}: ${rel(r.end)}.<br><small>${r.end.line}</small>`; }
  $('c4fig').innerHTML=fig; $('c4txt').innerHTML=txt; const t=r.tally; $('c4sum').innerHTML=`<b>Tally against ME:</b> ${t.gift} feed · ${t.same} same · ${t.win} I beat · ${t.leak} leak · ${t.hit} hit.<br>Friends <b>${t.friends}</b> against hitters <b>${t.hitters}</b>. Read in order: start, middle, end.`; }
function drawMis(){ const h=+$('mhr').value, r=E.twoNumbers(22,19,h); $('misOut').innerHTML=`floor ${r.line}, IT ${tn(r.use)}, ME ${tn(r.body)}: ${rel(r.start)}`; }
const REP=[['觀梅 plum-tree sparrows',34,43,43,'Shao Yong: tomorrow a girl will pick the blossoms, the gardener will chase her, she will fall and hurt her thigh. Fire beats Metal at the start, the middle is full of hitters, but the end is Earth, which feeds Metal: hurt, not killed.'],
['牡丹 peony',25,29,29,'Shao Yong: tomorrow at noon horses will trample it. Heaven (the horse) hits Wood ME at the start, twice in the middle, and nothing feeds ME.'],
['少年 young man with a glad face',7,3,17,'Shao Yong: a betrothal gift within 17 days (it happened). The start leaks, but the middle and end feed ME: hard first, then good.'],
['牛哀鳴 the grieving ox',8,6,21,'Shao Yong: slaughtered within 21 days (it happened). Earth beats Water at the start, but the middle and end both hit ME. The first look alone would have misled.']];
function rep(i){ const x=REP[i], r=E.build(x[1],x[2],x[3]); $('rfig').innerHTML=hexSVG(r.lines,{mv:r.line}); Sound.init();
  $('rtxt').innerHTML=`${r.primary.num} <span class="han">${r.primary.han}</span>, floor ${r.line}, changing to ${r.changedHex.num} <span class="han">${r.changedHex.han}</span>.<br>ME ${tn(r.body)}, IT ${tn(r.use)}.<br>Start ${rel(r.start)} · Middle ${rel(r.middleLower)}, ${rel(r.middleUpper)} · End ${rel(r.end)}<hr>${x[4]}`; }

try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
document.addEventListener('pointerdown',()=>{ Sound.init(); },{once:true});
castHome();
if(location.hash==='#learn') go('learn');
